<style>
:root{--bg:#e6dcee;--card:#f4eef7;--ink:#4a3f55;--mute:#8a7d97;--peach:#f2b5a7;--mint:#a9d9c4;--lav:#b9a8dc;--sky:#a8c8e8;--butter:#f0d9a0;--line:#d8cbe3;--rose:#e3a9c4;--bad:#e8908f;--lime:#c8dc9e;--aqua:#9ad6d8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2635;--card:#383244;--ink:#f0e8f5;--mute:#a99dbb;--peach:#d99a8c;--mint:#7fb89f;--lav:#9484c0;--sky:#7fa3c9;--butter:#cdb87a;--line:#4a4258;--rose:#b8809b;--bad:#d37a79;--lime:#9bb072;--aqua:#6aa6a9;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",Nunito,-apple-system,system-ui,sans-serif;font-weight:700}
body{min-height:100%;padding:12px 16px 120px;max-width:560px;margin:0 auto}
button,input{font:inherit;color:inherit}

.card{background:var(--card);border-radius:26px;padding:16px;margin-bottom:14px}
.chips{display:flex;gap:10px;margin-bottom:14px}

.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:12px;justify-content:center}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:var(--bg);margin-top:8px;cursor:pointer}

.flex{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:99px;padding:13px 20px;background:var(--lav);font-weight:800;cursor:pointer}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}

.authbtn{border:0;border-radius:99px;padding:9px 14px;background:var(--lav);font-weight:800}

#authgate{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:22px}
#authbox{width:min(100%,420px);background:var(--card);border-radius:26px;padding:24px;box-shadow:0 12px 50px #0002}
#authbox h2{font-size:23px;margin-bottom:8px}#authbox p{color:var(--mute);font-size:13px;line-height:1.45}
#authbox input{width:100%;box-sizing:border-box;margin:7px 0;padding:14px;border:1px solid #0001;border-radius:14px;background:var(--bg);font:inherit}
#authmsg{font-size:13px;color:var(--mute);min-height:20px;margin:8px 0}

/* Карта и социальные разделы */
.tabs{max-width:calc(100vw - 18px);overflow-x:auto;justify-content:flex-start;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;padding:10px 12px;font-size:12px}
.mapworld{height:min(78vh,820px);min-height:520px;aspect-ratio:1.2/1;position:relative;overflow:hidden;border-radius:24px;background:#b8d98c url("map_background.png") center/100% 100% no-repeat;box-shadow:0 8px 28px #405b3030;border:1px solid #d8e4c8;touch-action:pan-y}
.mapplace{position:absolute;transform:translate(-50%,-72%);border:0;background:transparent;cursor:pointer;text-align:center;z-index:2;color:#33452f;min-width:108px;padding:0;filter:drop-shadow(0 4px 3px #354b3a55)}
.maphouse{display:block;width:92px;height:82px;margin:0 auto;transition:transform .15s}
.mapplace:hover .maphouse,.mapplace:focus-visible .maphouse{transform:translateY(-5px) scale(1.06)}
.maplabel{display:block;max-width:160px;margin:-2px auto 0;padding:6px 10px;border-radius:12px;background:#fff5d7;border:1px solid #e7d59d;color:#3e3828;font-size:12px;font-weight:800;line-height:1.2;box-shadow:0 3px 8px #4b543733}
.mapempty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;border-radius:14px;background:#fff9e8dd;color:#50613d;font-weight:700;text-align:center;max-width:75%;box-shadow:0 3px 12px #405b3022}
.mapcard{background:var(--card);border-radius:22px;padding:14px;margin-top:12px}.mapcard .muted{margin-top:5px}
@media(max-width:600px){.mapworld{height:68vh;min-height:440px;aspect-ratio:auto;background-size:cover}.maphouse{width:72px;height:66px}.maplabel{font-size:10px;max-width:112px;padding:5px 7px}}
.mapcard{background:var(--card);border-radius:22px;padding:14px;margin-top:12px}.friendline,.chatline{display:flex;align-items:center;gap:11px;padding:12px;border-radius:18px;background:var(--bg);margin:8px 0}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--lav);font-size:18px;flex:none}.friendmeta{flex:1;min-width:0}.muted{font-size:12px;color:var(--mute);font-weight:600}.online{color:#29985b}.msgbubble{max-width:82%;padding:10px 13px;border-radius:17px;margin:7px 0;font-size:14px;overflow-wrap:anywhere}.msgmine{margin-left:auto;background:#d7edc9;color:#29432b}.msgother{margin-right:auto;background:var(--bg)}.chatlog{height:52vh;min-height:280px;overflow:auto;display:flex;flex-direction:column;padding:8px}.chatcompose{display:flex;gap:8px;position:sticky;bottom:0;background:var(--card);padding-top:8px}.chatcompose input{flex:1;min-width:0}.tinybtn{border:0;border-radius:50%;width:38px;height:38px;background:var(--lav);font-weight:900}
@media(max-width:390px){.tabs button{padding:9px 10px;font-size:11px}.maphouse{font-size:45px;width:76px}.maplabel{font-size:11px}}

</style>
</head>

<div id="profileShade" onclick="if(event.target===this)closeProfile()"><div id="profileBox"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2>Профиль</h2><div class="sub">Личный кабинет Shift Manager</div></div><button class="nav" onclick="closeProfile()">×</button></div><label>Имя пользователя</label><input id="profileName" maxlength="60" placeholder="Как к тебе обращаться"><label>Электронная почта</label><input id="profileEmail" type="email" readonly><div class="profile-row"><button class="authbtn" onclick="saveProfile()">Сохранить профиль</button></div><div class="profile-section"><b>Мои заведения</b><label>Текущее заведение для ревизии</label><select id="profileOrg" onchange="profileChooseOrg(this.value)"><option value="">Загрузка…</option></select><div class="profile-row"><button class="authbtn" onclick="profileGoRevision()">Открыть ревизию</button><button class="authbtn" style="background:var(--bg)" onclick="revJoinOrg();closeProfile()">Ввести код</button></div></div><div class="profile-section"><b>Безопасность</b><div class="sub" style="margin-top:6px">Смена пароля и подтверждение почты выполняются через настройки аккаунта Supabase.</div><div class="profile-row"><button class="authbtn" style="background:var(--bg)" onclick="doLogout()">Выйти из аккаунта</button></div></div><div id="profileMsg"></div></div></div>
<div id="authgate"><div id="authbox"><h2>Shift Manager</h2><p>Войди или создай аккаунт. Личные смены, доходы и расходы будут храниться отдельно в твоём аккаунте.</p><div id="emailAuthFields"><input id="authemail" type="email" autocomplete="email" placeholder="Электронная почта"><input id="authpass" type="password" autocomplete="current-password" placeholder="Пароль (от 6 символов)"><button class="authbtn" style="width:100%;margin-top:8px" onclick="doLogin()">Войти</button><button class="authbtn" style="width:100%;margin-top:8px;background:var(--bg)" onclick="doSignup()">Создать аккаунт</button></div><div id="authmsg"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://kmjiuonrcifllfudpjwx.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_CwVDC3nxMz4vn40Lme1DYg_WdC60v2b';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
var sbUser=null, cloudTimer=null, cloudReady=false;
function authMessage(t){document.getElementById('authmsg').textContent=t}
async function doLogin(){const email=document.getElementById('authemail').value.trim(),password=document.getElementById('authpass').value;if(!email||!password)return authMessage('Введи почту и пароль');authMessage('Входим…');const {error}=await sb.auth.signInWithPassword({email,password});authMessage(error?authFriendly(error):'Вход выполнен')}
async function doSignup(){const email=document.getElementById('authemail').value.trim(),password=document.getElementById('authpass').value;if(!email||password.length<6)return authMessage('Введи почту и пароль минимум из 6 символов');authMessage('Создаём аккаунт…');const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://aarnheight.github.io/finance-/'}});if(error)return authMessage(authFriendly(error));authMessage(data.session?'Аккаунт создан, вход выполнен.':'Аккаунт создан. Открой письмо и подтверди почту. Если ссылка выдаёт ошибку, проверь настройки Redirect URLs в Supabase.')}
function authFriendly(e){let m=e?.message||String(e);if(/redirect|url/i.test(m))return 'Supabase отклонил адрес возврата. Добавь https://aarnheight.github.io/finance-/ в Authentication → URL Configuration → Redirect URLs.';if(/invalid.*otp|otp.*expired/i.test(m))return 'Код неверный или истёк. Запроси новый.';return m}

async function doLogout(){await sb.auth.signOut()}
function setAuthUI(user){const gate=document.getElementById('authgate'),btn=document.getElementById('profileBtn');if(user){gate.style.display='none';btn.style.display='block';refreshProfileAvatar()}else{gate.style.display='flex';btn.style.display='none';closeProfile()}}
function refreshProfileAvatar(){const b=document.getElementById('profileBtn');if(!b||!sbUser)return;const n=(sbUser.user_metadata?.display_name||sbUser.email||'?').trim();b.textContent=(n[0]||'?').toUpperCase()}
function profileNote(t){const e=document.getElementById('profileMsg');if(e)e.textContent=t}
async function openProfile(){if(!sbUser)return;document.getElementById('profileShade').style.display='flex';document.getElementById('profileName').value=sbUser.user_metadata?.display_name||'';document.getElementById('profileEmail').value=sbUser.email||'';profileNote('');await profileLoadOrgs()}
function closeProfile(){const e=document.getElementById('profileShade');if(e)e.style.display='none'}
async function saveProfile(){if(!sbUser)return;const name=document.getElementById('profileName').value.trim();profileNote('Сохраняю…');const u=await sb.auth.updateUser({data:{...sbUser.user_metadata,display_name:name}});if(u.error)return profileNote('Ошибка: '+u.error.message);const p=await sb.from('profiles').upsert({id:sbUser.id,display_name:name},{onConflict:'id'});if(p.error)return profileNote('Имя сохранено в аккаунте, но профиль не обновлён: '+p.error.message);sbUser=u.data.user||sbUser;refreshProfileAvatar();profileNote('Профиль сохранён')}
async function profileLoadOrgs(){const sel=document.getElementById('profileOrg');sel.innerHTML='<option value=>Загрузка…</option>';let rows=[];try{const m=await sb.from('organization_members').select('organization_id').eq('user_id',sbUser.id);if(m.error)throw m.error;const ids=(m.data||[]).map(x=>x.organization_id);if(ids.length){const o=await sb.from('organizations').select('id,name,is_active').in('id',ids).order('name');if(o.error)throw o.error;rows=o.data||[]}if(REV.global){const o=await sb.from('organizations').select('id,name,is_active').order('name');if(!o.error)rows=o.data||[]}}catch(e){profileNote('Не удалось загрузить заведения: '+e.message)}REV.orgs=rows;const active=REV.org||sbUser.user_metadata?.active_org_id||'';sel.innerHTML='<option value="">Не выбрано</option>'+rows.map(o=>'<option value="'+o.id+'">'+revEsc(o.name)+(o.is_active?'':' (выключено)')+'</option>').join('');sel.value=rows.some(o=>o.id===active)?active:(rows[0]?.id||'')}
async function profileChooseOrg(id){REV.org=id||null;REV.session=null;if(sbUser){await sb.auth.updateUser({data:{active_org_id:id||null}})}if(id){try{await revLoadInventory()}catch(e){profileNote('Ошибка заведения: '+e.message)}}profileNote(id?'Текущее заведение изменено.':'Заведение не выбрано.')}
function profileGoRevision(){closeProfile();tab('r')}
async function loadCloud(user){sbUser=user;setAuthUI(user);const {data,error}=await sb.from('user_finance_data').select('data').eq('user_id',user.id).maybeSingle();if(error){authMessage('Ошибка загрузки: '+error.message);return}if(data&&data.data){S=Object.assign(S,data.data);norm()}else{await sb.from('user_finance_data').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()},{onConflict:'user_id'})}cloudReady=true;render();sb.rpc('touch_my_presence').then(()=>{});}
function queueCloudSave(){if(!sbUser||!cloudReady)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(async()=>{const snapshot=JSON.parse(JSON.stringify(S));const {error}=await sb.from('user_finance_data').upsert({user_id:sbUser.id,data:snapshot,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)console.error('Cloud save failed',error)},700)}
sb.auth.onAuthStateChange((_event,session)=>{if(session?.user){loadCloud(session.user)}else{sbUser=null;cloudReady=false;setAuthUI(null)}});
sb.auth.getSession().then(({data})=>{if(data.session?.user)loadCloud(data.session.user);else setAuthUI(null)});

 S.stamps.push({id:'c'+Date.now(),name:'Смена '+(n+1),ico:IC[n],type:'custom',col:c,hours:8,mode:'hour',rate:300});save();render();openT();var e=document.getElementById('sh');e.scrollTop=e.scrollHeight}
function delT(i){if(ST==S.stamps[i].id)ST=null;S.stamps.splice(i,1);save();render();drawT()}
function drawT(){var h='<h2 style="font-size:19px">⚙️ Настройка смен</h2><div class="lbl" style="margin-bottom:10px">Эти значения подставляются, когда ставишь смену одним тапом. Новые смены создаются кнопкой ＋ (до 6)</div>';
 S.stamps.forEach(function(x,i){var p='S.stamps['+i+']';h+='<div class="card" style="background:var(--bg);margin-bottom:10px"><div class="flex"><div class="ico" style="background:var(--'+x.col+')">'+x.ico+'</div><input class="inp" style="background:var(--card);min-width:0" value="'+esc(x.name)+'" oninput="'+p+'.name=this.value||\'Смена\';sv()">'+(x.type=='custom'?'<button class="x" onclick="delT('+i+')">✕</button>':'')+'</div>'
 +'<div class="seg" style="background:var(--card)"><button class="'+(x.mode=='fix'?'on':'')+'" onclick="'+p+'.mode=\'fix\';sv();drawT()">Фикс</button><button class="'+(x.mode=='hour'?'on':'')+'" onclick="'+p+'.mode=\'hour\';sv();drawT()">Почасовая</button></div>'
 +'<div class="flex"><div style="flex:1;min-width:0"><div class="lbl">Часов</div><input class="inp" style="background:var(--card)" type="number" inputmode="decimal" value="'+x.hours+'" oninput="'+p+'.hours=+this.value||0;sv()"></div><div style="flex:1;min-width:0"><div class="lbl">'+(x.mode=='fix'?'Сумма, ₽':'Ставка, ₽/ч')+'</div><input class="inp" style="background:var(--card)" type="number" inputmode="decimal" value="'+x.rate+'" oninput="'+p+'.rate=+this.value||0;sv()"></div></div></div>'});
 document.getElementById('sh').innerHTML=h+'<button class="btn" style="width:100%" onclick="closeS()">Готово</button>'}
function extraSum(){var s=0;(S.extra[mk()]||[]).forEach(function(x){s+=x.amt});return s}
function extraCard(){var l=S.extra[mk()]||[],h='<div class="card"><h2>➕ Дополнительный доход</h2>';
 if(!l.length)h+='<div class="empty" style="padding-top:0">Процент с выручки, чаевые, подработка — всё, что добавляется к заработку</div>';
 l.forEach(function(x,i){h+='<div class="row" style="cursor:default"><div class="ico" style="background:var(--mint)">💵</div><div class="t"><div>'+esc(x.name)+'</div></div><div class="s">+'+money(x.amt)+'</div><button class="x" onclick="delX('+i+')">✕</button></div>'});
 return h+'<div class="flex" style="margin-top:12px"><input class="inp" id="xn" placeholder="Процент с выручки" style="flex:1.2;min-width:0"><input class="inp" id="xa" type="number" inputmode="numeric" placeholder="Сумма" style="flex:1;min-width:0"><button class="btn" onclick="addX()" style="padding:13px 16px">＋</button></div></div>'}
function addX(){var n=document.getElementById('xn').value.trim()||'Доп. доход',a=+document.getElementById('xa').value;if(!a)return toast('Введи сумму');(S.extra[mk()]=S.extra[mk()]||[]).push({name:n,amt:a});save();render();toast('Добавлено 💵')}
function delX(i){S.extra[mk()].splice(i,1);save();render()}
render();

<script>
// Shared organizations and live inventory module
var REV={orgs:[],org:null,role:'member',global:false,session:null,items:[],entries:{},channel:null,loading:false};
function revEsc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function revMsg(x){toast(x)}
async function revInit(){if(!sbUser)return;try{
 let g=await sb.from('global_admins').select('user_id').eq('user_id',sbUser.id).maybeSingle();REV.global=!!g.data;
 await revLoadOrgs();
 }catch(e){console.error(e);revMsg('Ошибка загрузки заведений: '+e.message)}}
async function revLoadOrgs(){
 let q;
 if(REV.global){q=await sb.from('organizations').select('id,name,is_active').order('name')}
 else {let m=await sb.from('organization_members').select('organization_id,role');if(m.error)throw m.error;let ids=(m.data||[]).map(x=>x.organization_id);q=ids.length?await sb.from('organizations').select('id,name,is_active').in('id',ids).order('name'):{data:[],error:null};REV.memberships=m.data||[]}
 if(q.error)throw q.error;REV.orgs=q.data||[];
 if(!REV.orgs.some(o=>o.id===REV.org))REV.org=REV.orgs[0]?.id||null;
 if(REV.org){let m=(REV.memberships||[]).find(x=>x.organization_id===REV.org);REV.role=REV.global?'admin':(m?.role||'member');await revLoadInventory()}
}
async function revSelectOrg(id){REV.org=id||null;REV.session=null;await revLoadInventory();revRender()}
async function revCreateOrg(){let name=prompt('Название заведения');if(!name?.trim())return;let r=await sb.from('organizations').insert({name:name.trim(),created_by:sbUser.id}).select('id').single();if(r.error)return revMsg(r.error.message);let m=await sb.from('organization_members').insert({organization_id:r.data.id,user_id:sbUser.id,role:'admin'});if(m.error)return revMsg('Заведение создано, но не удалось назначить администратора: '+m.error.message);await revLoadOrgs();REV.org=r.data.id;await revLoadInventory();revRender();await revAudit('organization_created','organization',r.data.id,{name:name.trim()});revMsg('Заведение создано')}
async function revJoinOrg(){let code=prompt('Введи код приглашения');if(!code?.trim())return;code=code.trim().replace(/[\s-]/g,'').toUpperCase();let r=await sb.rpc('join_organization_by_code',{join_code:code});if(r.error){console.error('join_organization_by_code:',r.error);return revMsg('Не удалось вступить: '+(r.error.message||'ошибка Supabase')+(r.error.code?' ('+r.error.code+')':''))}REV.org=r.data;await revLoadOrgs();REV.org=r.data;await revLoadInventory();revRender();revMsg('Ты добавлен(а) в заведение')}
async function revMakeCode(){if(!REV.org||(!REV.global&&REV.role!=='admin'))return revMsg('Создавать приглашения может администратор заведения');let bytes=new Uint8Array(8);crypto.getRandomValues(bytes);let code=Array.from(bytes).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();let hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(code));let hex=Array.from(new Uint8Array(hash)).map(x=>x.toString(16).padStart(2,'0')).join('');let r=await sb.from('organization_invite_codes').insert({organization_id:REV.org,code_hash:hex,created_by:sbUser.id,label:'Код '+new Date().toLocaleDateString('ru-RU')}).select('id').single();if(r.error){console.error('invite code insert:',r.error);return revMsg('Не удалось создать код: '+r.error.message)}try{await navigator.clipboard.writeText(code)}catch(e){}prompt('Скопируй код и отправь коллеге. Он показывается только сейчас:',code);await revAudit('invite_code_created','invite_code',r.data.id,{});} 
async function revAddItem(){if(REV.role!=='admin')return;let name=prompt('Название позиции (например, Водка 0,7)');if(!name?.trim())return;let n=Number(prompt('Бутылок в полном ряду','10'));if(!Number.isInteger(n)||n<1)return revMsg('Укажи число бутылок в ряду');let r=await sb.from('inventory_items').insert({organization_id:REV.org,name:name.trim(),bottles_per_row:n,sort_order:REV.items.length});if(r.error)return revMsg(r.error.message);await revLoadInventory();revRender();await revAudit('inventory_item_created','inventory_item',null,{name,bottles_per_row:n})}
async function revLoadInventory(){REV.items=[];REV.entries={};REV.session=null;if(!REV.org)return;let a=await sb.from('inventory_items').select('*').eq('organization_id',REV.org).eq('is_active',true).order('sort_order').order('name');if(a.error)throw a.error;REV.items=a.data||[];let s=await sb.from('inventory_sessions').select('*').eq('organization_id',REV.org).eq('status','open').order('created_at',{ascending:false}).limit(1).maybeSingle();if(s.error)throw s.error;REV.session=s.data;
 if(REV.session){let e=await sb.from('inventory_entries').select('*').eq('session_id',REV.session.id);if(e.error)throw e.error;(e.data||[]).forEach(x=>REV.entries[x.item_id]=x)}
 revSubscribe();}
function revSubscribe(){if(REV.channel){sb.removeChannel(REV.channel);REV.channel=null}if(!REV.org)return;REV.channel=sb.channel('inventory-'+REV.org).on('postgres_changes',{event:'*',schema:'public',table:'inventory_entries'},async()=>{await revLoadInventory();revRender()}).on('postgres_changes',{event:'*',schema:'public',table:'inventory_items',filter:'organization_id=eq.'+REV.org},async()=>{await revLoadInventory();revRender()}).on('postgres_changes',{event:'*',schema:'public',table:'inventory_sessions',filter:'organization_id=eq.'+REV.org},async()=>{await revLoadInventory();revRender()}).subscribe()}
async function revNewSession(){if(!REV.org)return;let title=prompt('Название ревизии','Ревизия '+new Date().toLocaleDateString('ru-RU'))||'Ревизия';let r=await sb.from('inventory_sessions').insert({organization_id:REV.org,title,created_by:sbUser.id}).select('*').single();if(r.error)return revMsg(r.error.message);REV.session=r.data;REV.entries={};revRender();await revAudit('inventory_session_created','inventory_session',r.data.id,{title})}
async function revSet(itemId,field,value){if(!REV.session)return revMsg('Сначала начни ревизию');let item=REV.items.find(x=>x.id===itemId);let old=REV.entries[itemId]||{full_rows:0,loose_bottles:0};let row={session_id:REV.session.id,item_id:itemId,full_rows:field==='full_rows'?Math.max(0,parseInt(value||0)):old.full_rows,loose_bottles:field==='loose_bottles'?Math.max(0,parseInt(value||0)):old.loose_bottles,counted_by:sbUser.id,updated_at:new Date().toISOString()};let r=await sb.from('inventory_entries').upsert(row,{onConflict:'session_id,item_id'});if(r.error){revMsg(r.error.message);return}REV.entries[itemId]=row;let el=document.querySelector('[data-total="'+itemId+'"]');if(el)el.textContent=(row.full_rows*item.bottles_per_row+row.loose_bottles)+' шт.';}
async function revFinish(){if(!REV.session)return;let r=await sb.from('inventory_sessions').update({status:'completed',completed_at:new Date().toISOString()}).eq('id',REV.session.id);if(r.error)return revMsg(r.error.message);await revAudit('inventory_session_completed','inventory_session',REV.session.id,{});await revLoadInventory();revRender();revMsg('Ревизия завершена')}
async function revAudit(action,type,id,details){try{await sb.from('audit_logs').insert({organization_id:REV.org,actor_user_id:sbUser.id,action,entity_type:type,entity_id:id?String(id):null,details})}catch(e){console.warn(e)}}
async function revMembers(){let r=await sb.from('organization_members').select('user_id,role,joined_at').eq('organization_id',REV.org);if(r.error)return revMsg(r.error.message);let ids=(r.data||[]).map(x=>x.user_id);let p=ids.length?await sb.from('profiles').select('id,display_name').in('id',ids):{data:[]};let names={};(p.data||[]).forEach(x=>names[x.id]=x.display_name);let lines=(r.data||[]).map(x=>(names[x.user_id]||x.user_id.slice(0,8))+' — '+x.role).join('\n');alert('Участники заведения:\n'+lines)}
function revRender(){let root=document.getElementById('v');if(!root)return;let h='<div class="card"><div class="rev-head"><h2 style="margin:0">📦 Общая ревизия</h2><select class="inp" onchange="revSelectOrg(this.value)"><option value="">Выбери заведение</option>'+REV.orgs.map(o=>'<option value="'+o.id+'" '+(o.id===REV.org?'selected':'')+'>'+revEsc(o.name)+(o.is_active?'':' (выключено)')+'</option>').join('')+'</select></div><div class="rev-actions">'+(REV.global?'<button class="btn" onclick="revCreateOrg()">＋ Создать заведение</button>':'')+'<button class="btn alt" onclick="revJoinOrg()">Ввести код</button>'+(REV.org&&(REV.global||REV.role==='admin')?'<button class="btn alt" onclick="revMakeCode()">Создать код</button>':'')+(REV.org&&REV.role==='admin'?'<button class="btn alt" onclick="revMembers()">Участники</button>':'')+'</div></div>';
 if(!REV.org){h+='<div class="card empty">Создай заведение или вступи по коду приглашения.</div>';root.innerHTML=h;return}
 h+='<div class="card"><div class="flex" style="justify-content:space-between"><h2>'+(REV.session?revEsc(REV.session.title):'Нет активной ревизии')+'</h2><span class="pill">'+(REV.session?'Открыта':'Ожидание')+'</span></div>';
 if(!REV.session)h+='<button class="btn" style="width:100%" onclick="revNewSession()">＋ Начать новую ревизию</button>';
 else {h+='<div class="rev-muted">Внесённые значения видны всем участникам этого заведения сразу.</div><div class="rev-label"><span>Позиция</span><span>Ряды</span><span>Шт.</span><span>Итого</span></div>';
 if(!REV.items.length)h+='<div class="empty">Пока нет позиций. Администратор может добавить их ниже.</div>';
 REV.items.forEach(it=>{let e=REV.entries[it.id]||{full_rows:0,loose_bottles:0};let total=e.full_rows*it.bottles_per_row+e.loose_bottles;h+='<div class="rev-item"><div class="nm">'+revEsc(it.name)+'<div class="rev-muted">'+it.bottles_per_row+' шт. в ряду</div></div><input aria-label="Полные ряды" type="number" min="0" step="1" value="'+e.full_rows+'" '+(!REV.session?'disabled':'')+' onchange="revSet(\''+it.id+'\',\'full_rows\',this.value)"><input aria-label="Отдельные бутылки" type="number" min="0" step="1" value="'+e.loose_bottles+'" onchange="revSet(\''+it.id+'\',\'loose_bottles\',this.value)"><div class="rev-total" data-total="'+it.id+'">'+total+' шт.</div></div>'});
 h+='<div class="rev-actions"><button class="btn alt" onclick="revLoadInventory().then(revRender)">Обновить</button><button class="btn del" onclick="revFinish()">Завершить ревизию</button></div>'}
 if(REV.role==='admin')h+='<div class="rev-actions"><button class="btn alt" onclick="revAddItem()">＋ Добавить позицию</button></div>';
 h+='</div><div class="card"><h2>Формула подсчёта</h2><div class="rev-muted">Количество = полные ряды × бутылок в ряду + отдельные бутылки. Например: 3 × 10 + 4 = 34.</div></div>';root.innerHTML=h;
}
var baseRender=render;render=function(){if(TAB==='r'){document.getElementById('ttl').textContent='Ревизия';['s','m','e'].forEach((t,i)=>document.getElementById('t'+(i+1)).className='');document.getElementById('t4').className='on';document.getElementById('v').innerHTML='<div class="card empty">Загружаю заведения и склад…</div>';document.body.style.paddingBottom='120px';if(sbUser&&!REV.loading){REV.loading=true;revInit().then(revRender).catch(e=>{document.getElementById('v').innerHTML='<div class="card">Ошибка: '+revEsc(e.message)+'</div>'}).finally(()=>REV.loading=false)}else revRender();document.getElementById('pal').innerHTML='';return}document.getElementById('t4').className='';baseRender()};
// Ensure auth transitions also refresh the organization workspace.
let oldLoadCloud=loadCloud;loadCloud=async function(user){await oldLoadCloud(user);if(user){REV.orgs=[];REV.org=null;if(TAB==='r')await revInit()}};
</script>


<script>
// MAP + FRIENDS + PRIVATE CHATS
var SOCIAL={friends:[],requests:[],profiles:[],activeChat:null,chatChannel:null,chatUser:null,loaded:false};
function socialEsc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function socialName(p){return p?.display_name||'Пользователь'}
function socialErr(e){toast(e?.message||String(e))}
async function socialLoad(){if(!sbUser)return;let [f,r]=await Promise.all([sb.from('friendships').select('*').or('user_low.eq.'+sbUser.id+',user_high.eq.'+sbUser.id),sb.from('friend_requests').select('*').or('sender_id.eq.'+sbUser.id+',receiver_id.eq.'+sbUser.id).order('created_at',{ascending:false})]);if(f.error)throw f.error;if(r.error)throw r.error;SOCIAL.friends=f.data||[];SOCIAL.requests=r.data||[];let ids=[...new Set(SOCIAL.friends.flatMap(x=>[x.user_low,x.user_high]).filter(x=>x!==sbUser.id).concat(SOCIAL.requests.flatMap(x=>[x.sender_id,x.receiver_id]).filter(x=>x!==sbUser.id)))];let p=ids.length?await sb.rpc('get_social_profiles',{profile_ids:ids}):{data:[],error:null};if(p.error)throw p.error;SOCIAL.profiles=p.data||[];}
function socialProfile(id){return SOCIAL.profiles.find(p=>p.id===id)||{id,display_name:'Пользователь'}}
function isOnline(p){return p.last_seen_at&&Date.now()-new Date(p.last_seen_at).getTime()<120000}
function ago(p){if(isOnline(p))return '<span class="online">● В сети</span>';if(!p.last_seen_at)return 'Не в сети';let m=Math.floor((Date.now()-new Date(p.last_seen_at).getTime())/60000);return m<60?'Был(а) '+m+' мин. назад':m<1440?'Был(а) '+Math.floor(m/60)+' ч. назад':'Был(а) давно'}
function mapHouseSvg(){return '<svg class="maphouse" viewBox="0 0 120 104" aria-hidden="true"><ellipse cx="60" cy="96" rx="43" ry="7" fill="#314b2b" opacity=".22"/><path d="M22 45 60 12 98 45v43H22Z" fill="#f3d7a0" stroke="#70472c" stroke-width="4" stroke-linejoin="round"/><path d="M13 47 60 7l47 40-8 8-39-32-39 32Z" fill="#a94e32" stroke="#70472c" stroke-width="4" stroke-linejoin="round"/><path d="M47 88V61q13-17 26 0v27" fill="#75452d" stroke="#70472c" stroke-width="3"/><rect x="29" y="55" width="13" height="15" rx="2" fill="#8fd0d6" stroke="#70472c" stroke-width="2"/><rect x="79" y="55" width="13" height="15" rx="2" fill="#8fd0d6" stroke="#70472c" stroke-width="2"/><path d="M34 76h52" stroke="#70472c" stroke-width="3"/><path d="M39 43h42" stroke="#fff1c9" stroke-width="7" stroke-linecap="round"/><path d="M43 40h34" stroke="#70472c" stroke-width="2"/><circle cx="67" cy="74" r="2" fill="#f4d36e"/></svg>'}
function mapFallbackPosition(i,total){var spots=[[24,27],[73,66],[48,46],[78,30],[28,75],[57,83],[52,20],[87,48],[15,52],[65,50]];if(i<spots.length)return {x:spots[i][0],y:spots[i][1]};var angle=i*2.3999632297,r=.17+(.08*Math.floor(i/10));return{x:Math.max(12,Math.min(88,50+Math.cos(angle)*r*100)),y:Math.max(14,Math.min(86,50+Math.sin(angle)*r*85))}}
async function socialMap(){
 if(!REV.orgs?.length)await revInit();
 let orgs=REV.orgs||[],positions={};
 if(orgs.length){let pr=await sb.from('venue_map_positions').select('organization_id,x,y,display_order').in('organization_id',orgs.map(o=>o.id));if(!pr.error)(pr.data||[]).forEach(p=>positions[p.organization_id]=p)}
 let h='<div class="card"><h2>🗺️ Карта заведений</h2><div class="muted">Здесь появляются домики всех заведений, к которым у тебя есть доступ.</div></div><div class="mapworld" role="group" aria-label="Иллюстрированная карта заведений">';
 if(!orgs.length){h+='<div class="mapempty">Пока нет доступных заведений.<br>Когда тебя добавят в заведение, его домик появится здесь.</div>'}
 else {
  let sorted=orgs.slice().sort((a,b)=>{let pa=positions[a.id],pb=positions[b.id];return (pa?.display_order??999)-(pb?.display_order??999)});
  sorted.forEach((o,i)=>{let pos=positions[o.id]||mapFallbackPosition(i,sorted.length);let x=Number(pos.x),y=Number(pos.y);if(!Number.isFinite(x)||!Number.isFinite(y)){let f=mapFallbackPosition(i,sorted.length);x=f.x;y=f.y}h+='<button type="button" class="mapplace" style="left:'+x+'%;top:'+y+'%" aria-label="Открыть '+socialEsc(o.name)+'" onclick="mapOpen(\''+o.id+'\')">'+mapHouseSvg()+'<span class="maplabel">'+socialEsc(o.name)+'</span></button>'});
 }
 h+='</div><div id="mapVenueCard"></div>';
 document.getElementById('v').innerHTML=h;document.getElementById('ttl').textContent='Карта';document.getElementById('pal').innerHTML='';
}
function mapOpen(id){let o=(REV.orgs||[]).find(x=>x.id===id);if(!o)return;let card=document.getElementById('mapVenueCard');if(!card)return;card.innerHTML='<div class="mapcard"><div class="flex" style="justify-content:space-between;align-items:center"><h2>'+socialEsc(o.name)+'</h2><button class="tinybtn" onclick="document.getElementById(\'mapVenueCard\').innerHTML=\'\'" aria-label="Закрыть">×</button></div><div class="muted">'+(o.is_active?'Заведение активно':'Заведение временно отключено')+'</div></div>';card.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function friendsView(){await socialLoad();let h='<div class="card"><div class="flex" style="justify-content:space-between"><h2>👥 Друзья</h2><button class="btn" onclick="friendSearch()">＋ Найти</button></div><input class="inp" id="friendQuery" placeholder="Поиск среди друзей" oninput="friendFilter(this.value)">';if(!SOCIAL.friends.length)h+='<div class="empty">Пока нет друзей. Нажми «Найти».</div>';SOCIAL.friends.forEach(f=>{let id=f.user_low===sbUser.id?f.user_high:f.user_low,p=socialProfile(id);h+='<div class="friendline" data-friend="'+socialEsc(socialName(p).toLowerCase())+'"><div class="avatar">'+socialEsc(socialName(p)[0]||'👤')+'</div><div class="friendmeta"><b>'+socialEsc(socialName(p))+'</b><div class="muted">'+ago(p)+'</div></div><button class="tinybtn" onclick="openChat(\''+id+'\')">✉</button><button class="tinybtn" onclick="removeFriend(\''+id+'\')">×</button></div>'});let incoming=SOCIAL.requests.filter(x=>x.receiver_id===sbUser.id&&x.status==='pending');if(incoming.length){h+='<h2 style="margin-top:16px">Входящие заявки</h2>';incoming.forEach(r=>{let p=socialProfile(r.sender_id);h+='<div class="friendline"><div class="friendmeta"><b>'+socialEsc(socialName(p))+'</b></div><button class="btn" onclick="acceptFriend(\''+r.id+'\')">✓</button><button class="tinybtn" onclick="rejectFriend(\''+r.id+'\')">×</button></div>'})}h+='</div>';document.getElementById('v').innerHTML=h;document.getElementById('ttl').textContent='Друзья';document.getElementById('pal').innerHTML=''}
function friendFilter(q){document.querySelectorAll('[data-friend]').forEach(e=>e.style.display=e.dataset.friend.includes(q.toLowerCase())?'flex':'none')}
async function friendSearch(){let q=prompt('Имя пользователя для поиска');if(!q?.trim())return;let r=await sb.rpc('search_profiles',{search_text:q.trim()});if(r.error)return socialErr(r.error);if(!r.data?.length)return toast('Никого не нашли');let lines=r.data.map((p,i)=>(i+1)+'. '+socialName(p)).join('\n');let pick=prompt('Кому отправить заявку? Введи номер:\n'+lines);let p=r.data[Number(pick)-1];if(!p)return;let x=await sb.from('friend_requests').insert({sender_id:sbUser.id,receiver_id:p.id,status:'pending'});if(x.error)return socialErr(x.error);toast('Заявка отправлена');friendsView()}
async function acceptFriend(id){let r=await sb.rpc('accept_friend_request',{p_request_id:id});if(r.error)return socialErr(r.error);await friendsView()}
async function rejectFriend(id){let r=await sb.from('friend_requests').update({status:'rejected',updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return socialErr(r.error);await friendsView()}
async function removeFriend(id){if(!confirm('Удалить пользователя из друзей?'))return;let a=sbUser.id<id?sbUser.id:id,b=sbUser.id<id?id:sbUser.id;let r=await sb.from('friendships').delete().eq('user_low',a).eq('user_high',b);if(r.error)return socialErr(r.error);await friendsView()}
async function chatsView(){await socialLoad();let f=SOCIAL.friends;let h='<div class="card"><h2>💬 Сообщения</h2>';for(let x of f){let id=x.user_low===sbUser.id?x.user_high:x.user_low,p=socialProfile(id);h+='<div class="chatline" onclick="openChat(\''+id+'\')"><div class="avatar">'+socialEsc(socialName(p)[0]||'👤')+'</div><div class="friendmeta"><b>'+socialEsc(socialName(p))+'</b><div class="muted">'+ago(p)+'</div></div><span>›</span></div>'}if(!f.length)h+='<div class="empty">Добавь друзей, чтобы начать переписку.</div>';h+='</div>';document.getElementById('v').innerHTML=h;document.getElementById('ttl').textContent='Сообщения';document.getElementById('pal').innerHTML=''}
async function openChat(other){try{let r=await sb.rpc('open_direct_conversation',{p_other_user:other});if(r.error)throw r.error;SOCIAL.activeChat=r.data;SOCIAL.chatUser=other;await chatRender();if(SOCIAL.chatChannel)sb.removeChannel(SOCIAL.chatChannel);SOCIAL.chatChannel=sb.channel('chat-'+r.data).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+r.data},()=>chatRender()).subscribe();}catch(e){socialErr(e)}}
async function chatRender(){let id=SOCIAL.activeChat,p=socialProfile(SOCIAL.chatUser);let r=await sb.from('messages').select('*').eq('conversation_id',id).order('created_at');if(r.error)return socialErr(r.error);let h='<div class="card"><div class="flex"><button class="nav" onclick="tab(\'chats\')">‹</button><div><b>'+socialEsc(socialName(p))+'</b><div class="muted">'+ago(p)+'</div></div></div><div class="chatlog" id="chatlog">';(r.data||[]).forEach(m=>{h+='<div class="msgbubble '+(m.sender_id===sbUser.id?'msgmine':'msgother')+'">'+socialEsc(m.content)+'<div class="muted" style="text-align:right">'+new Date(m.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</div></div>'});h+='</div><div class="chatcompose"><input class="inp" id="chatText" placeholder="Напиши сообщение…" onkeydown="if(event.key===\'Enter\')sendChat()"><button class="btn" onclick="sendChat()">➤</button></div></div>';document.getElementById('v').innerHTML=h;document.getElementById('ttl').textContent='Чат';document.getElementById('pal').innerHTML='';let log=document.getElementById('chatlog');log.scrollTop=log.scrollHeight;await sb.from('conversation_members').update({last_read_at:new Date().toISOString()}).eq('conversation_id',id).eq('user_id',sbUser.id)}
async function sendChat(){let el=document.getElementById('chatText'),content=el?.value.trim();if(!content)return;el.value='';let r=await sb.from('messages').insert({conversation_id:SOCIAL.activeChat,sender_id:sbUser.id,content});if(r.error){el.value=content;return socialErr(r.error)}await chatRender()}
// Wrap current renderer; original finance and revision renderers remain intact.
var renderBeforeSocial=render;
render=function(){if(TAB==='map'||TAB==='friends'||TAB==='chats'){document.getElementById('v').innerHTML='<div class="card empty">Загружаю…</div>';document.getElementById('pal').innerHTML='';document.body.style.paddingBottom='120px';['t1','t2','t3','t4','t5','t6','t7'].forEach(id=>{let e=document.getElementById(id);if(e)e.className=(id==='t5'&&TAB==='map'||id==='t6'&&TAB==='friends'||id==='t7'&&TAB==='chats')?'on':''});let fn=TAB==='map'?socialMap:TAB==='friends'?friendsView:chatsView;fn().catch(e=>{document.getElementById('v').innerHTML='<div class="card">Ошибка: '+socialEsc(e.message)+'</div>'});return}['t5','t6','t7'].forEach(id=>document.getElementById(id).className='');renderBeforeSocial()};
// Presence heartbeat: last_seen_at only; no financial data is involved.
setInterval(()=>{if(sbUser)sb.from('profiles').update({last_seen_at:new Date().toISOString()}).eq('id',sbUser.id).then(()=>{})},60000);
</script>
