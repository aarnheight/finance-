<div id="profileShade" onclick="if(event.target===this)closeProfile()"><div id="profileBox"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2>Профиль</h2><div class="sub">Личный кабинет Shift Manager</div></div><button class="nav" onclick="closeProfile()">×</button></div><label>Имя пользователя</label><input id="profileName" maxlength="60" placeholder="Как к тебе обращаться"><label>Электронная почта</label><input id="profileEmail" type="email" readonly><div class="profile-row"><button class="authbtn" onclick="saveProfile()">Сохранить профиль</button></div><div class="profile-section"><b>Мои заведения</b><label>Текущее заведение для ревизии</label><select id="profileOrg" onchange="profileChooseOrg(this.value)"><option value="">Загрузка…</option></select><div class="profile-row"><button class="authbtn" onclick="profileGoRevision()">Открыть ревизию</button><button class="authbtn" style="background:var(--bg)" onclick="revJoinOrg();closeProfile()">Ввести код</button></div></div><div class="profile-section"><b>Безопасность</b><div class="sub" style="margin-top:6px">Смена пароля и подтверждение почты выполняются через настройки аккаунта Supabase.</div><div class="profile-row"><button class="authbtn" style="background:var(--bg)" onclick="doLogout()">Выйти из аккаунта</button></div></div><div id="profileMsg"></div></div></div>

<script>
const SUPABASE_URL='https://kmjiuonrcifllfudpjwx.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_CwVDC3nxMz4vn40Lme1DYg_WdC60v2b';
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
var sbUser=null, cloudTimer=null, cloudReady=false;

async function doLogin(){const email=document.getElementById('authemail').value.trim(),password=document.getElementById('authpass').value;if(!email||!password)return authMessage('Введи почту и пароль');authMessage('Входим…');const {error}=await sb.auth.signInWithPassword({email,password});authMessage(error?authFriendly(error):'Вход выполнен')}
async function doSignup(){const email=document.getElementById('authemail').value.trim(),password=document.getElementById('authpass').value;if(!email||password.length<6)return authMessage('Введи почту и пароль минимум из 6 символов');authMessage('Создаём аккаунт…');const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://aarnheight.github.io/finance-/'}});if(error)return authMessage(authFriendly(error));authMessage(data.session?'Аккаунт создан, вход выполнен.':'Аккаунт создан. Открой письмо и подтверди почту. Если ссылка выдаёт ошибку, проверь настройки Redirect URLs в Supabase.')}

async function doLogout(){await sb.auth.signOut()}
function setAuthUI(user){const gate=document.getElementById('authgate'),btn=document.getElementById('profileBtn');if(user){gate.style.display='none';btn.style.display='block';refreshProfileAvatar()}else{gate.style.display='flex';btn.style.display='none';closeProfile()}}
function refreshProfileAvatar(){const b=document.getElementById('profileBtn');if(!b||!sbUser)return;const n=(sbUser.user_metadata?.display_name||sbUser.email||'?').trim();b.textContent=(n[0]||'?').toUpperCase()}
function profileNote(t){const e=document.getElementById('profileMsg');if(e)e.textContent=t}

 if(!sbUser)return;
 const name=document.getElementById('profileName').value.trim();
 profileNote('Сохраняю…');
 const p=await sb.from('profiles').update({display_name:name}).eq('id',sbUser.id).select('id').maybeSingle();
 if(p.error)return profileNote('Ошибка сохранения профиля: '+p.error.message);
 if(!p.data)return profileNote('Профиль не обновлён: запись не найдена или нет доступа.');
 const u=await sb.auth.updateUser({data:{...(sbUser.user_metadata||{}),display_name:name}});

}
async function profileLoadOrgs(){const sel=document.getElementById('profileOrg');sel.innerHTML='<option value="">Загрузка…</option>';let rows=[];try{const m=await sb.from('organization_members').select('organization_id').eq('user_id',sbUser.id);if(m.error)throw m.error;const ids=(m.data||[]).map(x=>x.organization_id);if(ids.length){const o=await sb.from('organizations').select('id,name,is_active').in('id',ids).order('name');if(o.error)throw o.error;rows=o.data||[]}if(REV.global){const o=await sb.from('organizations').select('id,name,is_active').order('name');if(!o.error)rows=o.data||[]}}catch(e){profileNote('Не удалось загрузить заведения: '+e.message)}REV.orgs=rows;const active=REV.org||sbUser.user_metadata?.active_org_id||'';sel.innerHTML='<option value="">Не выбрано</option>'+rows.map(o=>'<option value="'+o.id+'">'+revEsc(o.name)+(o.is_active?'':' (выключено)')+'</option>').join('');sel.value=rows.some(o=>o.id===active)?active:(rows[0]?.id||'')}
async function profileChooseOrg(id){REV.org=id||null;REV.session=null;if(sbUser){await sb.auth.updateUser({data:{active_org_id:id||null}})}if(id){try{await revLoadInventory()}catch(e){profileNote('Ошибка заведения: '+e.message)}}profileNote(id?'Текущее заведение изменено.':'Заведение не выбрано.')}

function syncState(t){var e=document.getElementById('sync');if(e){e.textContent={ok:'☁️',wait:'⏳',off:'⚠️'}[t]||'';e.title={ok:'Синхронизировано',wait:'Сохраняю…',off:'Нет связи: сохранено на телефоне'}[t]||''}}
function lsKey(){return sbUser?'smeny_u_'+sbUser.id:'smeny_v1'}
function resetS(){S=JSON.parse(DEF);norm()}

async function doReset(){if(!sb)return;const email=document.getElementById('authemail').value.trim();if(!email)return authMessage('Введи почту, на неё придёт ссылка');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://aarnheight.github.io/finance-/'});authMessage(error?authFriendly(error):'Письмо отправлено. Открой ссылку из него.')}
async function newPass(){const p=prompt('Новый пароль (от 6 символов)');if(!p||p.length<6)return;const {error}=await sb.auth.updateUser({password:p});toast(error?error.message:'Пароль обновлён ✨')}
async function loadCloud(user){
 if(cloudBusy||(sbUser&&sbUser.id===user.id&&cloudReady)){if(sbUser&&sbUser.id===user.id)sbUser=user;return}
 cloudBusy=true;sbUser=user;cloudReady=false;setAuthUI(user);
 try{
  var key=lsKey(),loc=null,old=null;
  try{loc=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}
  if(!loc){try{old=JSON.parse(localStorage.getItem('smeny_v1')||'null')}catch(e){}}
  const r=await sb.from('user_finance_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();
  resetS();
  if(r.error){if(loc)S=Object.assign(S,loc);norm();syncState('off');render();return}
  var dirty=localStorage.getItem(key+'_d')=='1',cts=(loc&&loc._ts)||0,sts=r.data?Date.parse(r.data.updated_at)||0:0,push=false;
  if(r.data&&r.data.data&&!(dirty&&loc&&cts>sts))S=Object.assign(S,r.data.data);
  else if(loc){S=Object.assign(S,loc);push=true}
  else if(old&&!r.data){S=Object.assign(S,old);push=true;localStorage.removeItem('smeny_v1')}
  else push=!r.data;
  norm();cloudReady=true;try{localStorage.setItem(key,JSON.stringify(S))}catch(e){}render();
  if(push)await pushNow();else syncState('ok');
  sb.rpc('touch_my_presence').then(function(){},function(){});
 }catch(e){syncState('off')}finally{cloudBusy=false}
}
async function pushNow(){if(!sb||!sbUser||!cloudReady)return;syncState('wait');var ts=new Date().toISOString();

 var rows=r.data||[],lines=rows.map(function(x,i){return(i+1)+'. '+(n[x.user_id]||x.user_id.slice(0,8))+' — '+revRoleLabel(x.role)});

 if(!pick||!rows[+pick-1])return;
 var target=rows[+pick-1];if(target.user_id===sbUser.id)return revMsg('Свою роль здесь изменить нельзя');
 var opts=REV.role==='главный'?['owner','manager','admin','senior_waiter','waiter','trainee']:REV.role==='владелец'?['manager','admin','senior_waiter','waiter','trainee']:['admin','senior_waiter','waiter','trainee'];
 if(target.role==='owner'&&REV.role!=='главный')return revMsg('Назначать и менять владельцев может только главный администратор');
 var val=prompt('Доступные роли: '+opts.join(', '),target.role);if(opts.indexOf(val)>=0)await revSetMemberRole(target.user_id,val)
}
async function revNewSession(){if(!REV.org)return;var title=prompt('Название ревизии',({bar:'Бар',supplies:'Хозтовары',kitchen:'Кухня'}[REV.section])+' · '+new Date().toLocaleDateString('ru-RU'));if(title===null)return;title=title.trim()||'Ревизия';
 const r=await sb.from('inventory_sessions').insert({organization_id:REV.org,title:title,created_by:sbUser.id,category:REV.section}).select('*').single();if(r.error)return revMsg(r.error.message);
 try{await revLoadInventory()}catch(e){}render();revAudit('inventory_session_created','inventory_session',r.data.id,{title:title})}
async function revFinish(){if(!REV.session||!confirm('Завершить ревизию? После этого значения изменить нельзя.'))return;await revFlush();const r=await sb.from('inventory_sessions').update({status:'completed',completed_at:new Date().toISOString()}).eq('id',REV.session.id);if(r.error)return revMsg(r.error.message);
 revAudit('inventory_session_completed','inventory_session',REV.session.id,{});try{await revLoadInventory()}catch(e){}render();revMsg('Ревизия завершена ✨')}
async function revAudit(a,t,id,d){try{await sb.from('audit_logs').insert({organization_id:REV.org,actor_user_id:sbUser.id,action:a,entity_type:t,entity_id:id?String(id):null,details:d})}catch(e){}}
function revItem(id){var it=id?REV.items.filter(function(x){return x.id===id})[0]:null;RI=it?{id:id,name:it.name,n:it.bottles_per_row,m:it.min_stock||0}:{id:'',name:'',n:10,m:0};
 document.getElementById('sh').innerHTML='<h2 style="font-size:19px">'+(id?'Позиция':'Новая позиция')+'</h2><div class="lbl">Название</div><input class="inp" placeholder="Например, Харбин премиум" value="'+revEsc(RI.name)+'" oninput="RI.name=this.value"><div class="flex"><div style="flex:1;min-width:0"><div class="lbl">Бутылок в полном ряду</div><input class="inp" type="number" inputmode="numeric" value="'+RI.n+'" oninput="RI.n=+this.value"></div>'+(REV.x?'<div style="flex:1;min-width:0"><div class="lbl">Норма (минимум)</div><input class="inp" type="number" inputmode="numeric" value="'+RI.m+'" oninput="RI.m=+this.value"></div>':'')+'</div><div class="flex" style="margin-top:14px">'+(id?'<button class="btn del" onclick="revItemDel()">Убрать</button>':'')+'<button class="btn alt" onclick="closeS()" style="flex:1">Отмена</button><button class="btn" onclick="revItemSave()" style="flex:1.4">Сохранить</button></div>';
 document.getElementById('bg').classList.add('open')}
async function revItemSave(){var name=(RI.name||'').trim(),n=Math.floor(RI.n);if(!name)return revMsg('Введи название');if(!(n>=1))return revMsg('Укажи бутылок в ряду');var row={name:name,bottles_per_row:n,category:REV.section};if(REV.x)row.min_stock=Math.max(0,Math.floor(RI.m)||0);
 const r=RI.id?await sb.from('inventory_items').update(row).eq('id',RI.id):await sb.from('inventory_items').insert(Object.assign({organization_id:REV.org,sort_order:REV.items.length},row));if(r.error)return revMsg(r.error.message);
 closeS();try{await revLoadInventory()}catch(e){}render();revAudit(RI.id?'inventory_item_updated':'inventory_item_created','inventory_item',RI.id||null,{name:name,bottles_per_row:n})}
async function revItemDel(){if(!confirm('Убрать позицию из ревизии?'))return;const r=await sb.from('inventory_items').update({is_active:false}).eq('id',RI.id);if(r.error)return revMsg(r.error.message);closeS();try{await revLoadInventory()}catch(e){}render()}
function revBulk(){document.getElementById('sh').innerHTML='<h2 style="font-size:19px">📋 Добавить списком</h2><div class="lbl">По одной позиции в строке. «Название, 10» — 10 бутылок в ряду (иначе 10 по умолчанию)</div><textarea class="inp" id="rbt" rows="9" style="resize:none" placeholder="Харбин премиум, 10&#10;Балтика 7, 12"></textarea><div class="flex" style="margin-top:14px"><button class="btn alt" onclick="closeS()" style="flex:1">Отмена</button><button class="btn" onclick="revBulkSave()" style="flex:1.4">Добавить</button></div>';document.getElementById('bg').classList.add('open')}
async function revBulkSave(){var rows=[],have=REV.items.map(function(x){return x.name.toLowerCase()});document.getElementById('rbt').value.split('\n').forEach(function(l){l=l.trim();if(!l)return;var m=l.match(/^(.*?)[,;]\s*(\d+)$/),n=10;if(m){l=m[1].trim();n=+m[2]||10}if(l&&have.indexOf(l.toLowerCase())<0){have.push(l.toLowerCase());rows.push({organization_id:REV.org,name:l,bottles_per_row:n,category:REV.section,sort_order:REV.items.length+rows.length})}});
 if(!rows.length)return revMsg('Нечего добавлять');const r=await sb.from('inventory_items').insert(rows);if(r.error)return revMsg(r.error.message);closeS();try{await revLoadInventory()}catch(e){}render();revMsg('Добавлено: '+rows.length+' ✨')}
window.addEventListener('online',function(){if(sbUser&&!cloudReady&&!cloudBusy)loadCloud(sbUser);else if(sbUser&&cloudReady&&localStorage.getItem(lsKey()+'_d')=='1')pushNow();revFlush()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&sbUser&&cloudReady&&localStorage.getItem(lsKey()+'_d')=='1'){clearTimeout(cloudTimer);pushNow()}});
render();
</script>
